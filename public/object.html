<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Объект · Qadam</title>
<meta name="description" content="Карточка объекта недвижимости: фото, характеристики, расположение, ипотека и запись на просмотр.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .obj-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: flex-end; }
  .obj-head h1 { font-size: var(--fs-2xl); }
  .side-price .price { font-size: var(--fs-2xl); }
  .market { display: flex; flex-direction: column; gap: 8px; }
  .market .scale { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--ok-soft), var(--surface-2), var(--warn-soft)); }
  .market .scale i { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--ink); transform: translateX(-50%); }
  .market .scale b { position: absolute; top: -2px; left: 50%; width: 1px; height: 12px; background: var(--line-strong); }
  .features { display: flex; flex-wrap: wrap; gap: 8px; }
  .desc { white-space: pre-line; max-width: 75ch; }
  .obj-sections { display: flex; flex-direction: column; gap: 32px; margin-top: 24px; }
  .obj-sections h2 { font-size: var(--fs-xl); margin-bottom: 14px; }
  .links-row { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body data-page="buy">
<header id="site-header"></header>
<main>
  <div class="wrap" id="root"><p class="muted" style="padding-block:40px">Загружаем объект…</p></div>
</main>
<footer id="site-footer"></footer>

<script type="module">
import { boot, db, esc, num, money, moneyShort, link, param, byId, listingCard, listingTitle, listingSpecs, listingBadges, priceLabel, pricePerM2,
  planSvg, icon, PTYPE, DEAL, favorites, compare, recent, openLead, makeMap, pricePin, waLink, phoneDigits, mortgage, toast, DEMO } from './app.js';

boot(async (s) => {
  const root = document.getElementById('root');
  const id = Number(param('id'));
  const l = id ? await db.get('listings', id) : null;
  if (!l || !['published', 'reserved', 'sold'].includes(l.status)) {
    root.innerHTML = `<div class="empty" style="margin-block:40px"><h2>Объект не найден</h2><p>Возможно, он снят с продажи. Посмотрите похожие варианты в каталоге.</p><a class="btn" href="catalog.html">Перейти в каталог</a></div>`;
    return;
  }
  document.body.dataset.page = l.deal_type === 'sale' ? 'buy' : 'rent';
  document.title = `${listingTitle(l)} · ${s.company.name}`;
  db.rpc('bump_listing_view', { p_id: l.id }).catch(() => {});
  recent.push(l.id);

  const [city, district, agent, priceIndex, others] = await Promise.all([
    l.city_id ? db.get('cities', l.city_id) : null,
    l.district_id ? db.get('districts', l.district_id) : null,
    l.agent_id ? db.get('agents', l.agent_id) : null,
    l.city_id ? db.list('price_index', { eq: { city_id: l.city_id } }) : [],
    db.list('listings', { eq: { status: 'published', deal_type: l.deal_type, property_type: l.property_type } })
  ]);
  const cities = byId(city ? [city] : []), districts = byId(district ? [district] : []);
  const where = [city?.name, district?.name, l.address].filter(Boolean).join(', ');
  const photos = l.photos || [];
  const slides = photos.length ? photos : [null];

  // ---- Паспорт объекта ----
  const yes = v => v ? 'да' : 'нет';
  const rows = [
    ['Тип сделки', DEAL[l.deal_type]],
    ['Тип объекта', l.commercial_kind || PTYPE[l.property_type]],
    ['Общая площадь', l.area_total && `${num(l.area_total, 1)} м²`],
    ['Жилая площадь', l.area_living && `${num(l.area_living, 1)} м²`],
    ['Кухня', l.area_kitchen && `${num(l.area_kitchen, 1)} м²`],
    ['Участок', l.land_area && `${num(l.land_area, 2)} сот.`],
    ['Комнат', l.rooms],
    ['Этаж', l.floor && (l.floors_total ? `${l.floor} из ${l.floors_total}` : l.floor)],
    ['Этажей в доме', !l.floor && l.floors_total],
    ['Год постройки', l.year_built],
    ['Материал стен', l.building_type],
    ['Состояние', l.condition],
    ['Высота потолков', l.ceiling_height && `${num(l.ceiling_height, 2)} м`],
    ['Санузел', l.bathroom],
    ['Балкон', l.balcony],
    ['Парковка', l.parking],
    ['Мебель', l.furniture],
    ['Жилой комплекс', l.complex_name],
    ['Новостройка', l.is_new_building ? 'да' : null],
    ['Ипотека', l.deal_type === 'sale' ? yes(l.mortgage_ok) : null],
    ['Рассрочка', l.installment_ok ? 'да' : null],
    ['Обмен', l.exchange_ok ? 'рассмотрим' : null],
    ['В залоге у банка', l.pledged ? 'да, гасится при сделке' : null],
    ['Артикул', l.code]
  ].filter(([, v]) => v !== null && v !== undefined && v !== '' && v !== false);

  // ---- Цена относительно рынка (средняя цена м² по городу из базы цен) ----
  let marketHtml = '';
  const pi = priceIndex[0];
  if (pi && l.area_total && l.price) {
    const avg = l.deal_type === 'sale'
      ? (l.property_type === 'commercial' ? pi.commercial_sale_m2 : l.property_type === 'apartment' ? pi.apt_sale_m2 : null)
      : (l.property_type === 'commercial' ? pi.commercial_rent_m2 : l.property_type === 'apartment' ? pi.apt_rent_m2 : null);
    if (avg) {
      const own = l.price / l.area_total;
      const diff = (own / avg - 1) * 100;
      const pos = Math.max(4, Math.min(96, 50 + diff * 1.5));
      marketHtml = `<div class="panel-box market">
        <span class="eyebrow">Цена за м² и рынок</span>
        <div class="row between"><b class="mono">${num(Math.round(own))} ₸/м²</b><span class="small muted">средняя по городу ${num(avg)} ₸/м²</span></div>
        <div class="scale" aria-hidden="true"><b></b><i style="left:${pos}%"></i></div>
        <p class="small">${Math.abs(diff) < 3 ? 'На уровне средней цены по городу' : diff < 0 ? `На ${num(Math.abs(diff), 0)}% ниже средней по городу` : `На ${num(diff, 0)}% выше средней по городу`}.
        <span class="muted">Средняя не учитывает район и ремонт — точнее покажет <a href="valuation.html">оценка</a>.</span></p>
      </div>`;
    }
  }

  // ---- Ипотека (на продажу) ----
  const mort = l.deal_type === 'sale' && l.mortgage_ok ? mortgage({ price: l.price, down: l.price * 0.2, rate: 18, years: 20 }) : null;
  const naurymz = l.deal_type === 'sale' && l.mortgage_ok && l.price <= 36000000 ? mortgage({ price: l.price, down: l.price * 0.2, rate: 9, years: 19 }) : null;

  const tel = agent?.phone || s.contacts.phone;
  const wa = waLink(agent?.whatsapp || s.contacts.whatsapp, `Здравствуйте! Интересует объект ${l.code}: ${listingTitle(l)} — ${location.href}`);
  const twoGis = l.lat && l.lng ? `https://2gis.kz/geo/${l.lng},${l.lat}` : '';
  const similar = others.filter(o => o.id !== l.id && o.city_id === l.city_id && Math.abs(o.price - l.price) / l.price < 0.35).slice(0, 4);

  root.innerHTML = `
    <div style="padding-top:20px" class="stack">
      <nav class="crumbs" aria-label="Навигация"><a href="index.html">Главная</a><span>/</span>
        <a href="${link('catalog.html', { deal: l.deal_type })}">${l.deal_type === 'sale' ? 'Купить' : 'Снять'}</a><span>/</span>
        <a href="${link('catalog.html', { type: l.property_type })}">${esc(PTYPE[l.property_type])}</a><span>/</span><span>${esc(l.code || '')}</span></nav>
      <div class="obj-head">
        <div class="stack" style="gap:8px">
          <div class="row">${listingBadges(l)}</div>
          <h1>${esc(listingTitle(l))}</h1>
          <p class="muted">${icon('pin')} ${esc(where)}</p>
        </div>
        <div class="row">
          <button class="btn ghost sm" type="button" data-fav="${l.id}" aria-pressed="${favorites.has(l.id)}">${icon('heart')} В избранное</button>
          <button class="btn ghost sm" type="button" id="cmp">${icon('compare')} <span>${compare.has(l.id) ? 'В сравнении' : 'Сравнить'}</span></button>
          <button class="btn ghost sm" type="button" id="share">${icon('share')} Поделиться</button>
        </div>
      </div>
    </div>
    <div class="object-layout">
      <div>
        <div class="gallery">
          <div class="gallery-main" id="g-main"></div>
          ${slides.length > 1 ? `<div class="thumbs" id="g-thumbs">${slides.map((p, i) => `<button type="button" data-i="${i}" aria-label="Фото ${i + 1}"><img src="${esc(p)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
          <div class="links-row">
            ${l.video_url ? `<a class="btn ghost sm" href="${esc(l.video_url)}" target="_blank" rel="noopener">Видео</a>` : ''}
            ${l.tour_url ? `<a class="btn ghost sm" href="${esc(l.tour_url)}" target="_blank" rel="noopener">3D-тур</a>` : ''}
          </div>
        </div>
        <div class="obj-sections">
          <section><h2>Характеристики</h2>
            <dl class="passport">${rows.map(([k, v]) => `<div class="pr"><dt>${esc(k)}</dt><span class="dots"></span><dd>${esc(v)}</dd></div>`).join('')}</dl>
          </section>
          ${l.description ? `<section><h2>Описание</h2><p class="desc">${esc(l.description)}</p></section>` : ''}
          ${(l.features || []).length ? `<section><h2>Особенности</h2><div class="features">${l.features.map(f => `<span class="chip">${esc(f)}</span>`).join('')}</div></section>` : ''}
          ${l.lat && l.lng ? `<section><h2>На карте</h2><div class="map-box small" id="map"></div>
            <div class="links-row" style="margin-top:10px">${twoGis ? `<a class="btn ghost sm" href="${twoGis}" target="_blank" rel="noopener">Открыть в 2GIS</a>` : ''}
            <a class="btn ghost sm" href="https://www.openstreetmap.org/?mlat=${l.lat}&mlon=${l.lng}#map=16/${l.lat}/${l.lng}" target="_blank" rel="noopener">OpenStreetMap</a></div></section>` : ''}
          <section><h2>Сделка под ключ</h2>
            <div class="tiles">
              <a class="tile" href="services.html#proverka-chistoty">${icon('check', 'ico')}<h3>Проверка юридической чистоты</h3><p>Собственник, обременения, аресты, долги, согласие супруга.</p><span class="from">от 30 000 ₸</span></a>
              <a class="tile" href="valuation.html">${icon('ruler', 'ico')}<h3>Оценка для банка</h3><p>Отчёт для ипотеки или для торга с продавцом.</p><span class="from">от 20 000 ₸</span></a>
              <a class="tile" href="services.html#soprovozhdenie-sdelki">${icon('pen', 'ico')}<h3>Сопровождение сделки</h3><p>Договор, нотариус или ЦОН, безопасные расчёты, регистрация.</p><span class="from">от 100 000 ₸</span></a>
            </div>
          </section>
          ${similar.length ? `<section><h2>Похожие объекты</h2><div class="cards">${similar.map(o => listingCard(o, { cities, districts })).join('')}</div></section>` : ''}
        </div>
      </div>
      <aside class="object-side">
        <div class="panel-box stack side-price">
          <div class="price">${priceLabel(l)}</div>
          ${pricePerM2(l) ? `<div class="price-m2">${pricePerM2(l)}</div>` : ''}
          ${s.finance.usd_rate && l.deal_type === 'sale' ? `<div class="price-m2">≈ $${num(Math.round(l.price / s.finance.usd_rate))}</div>` : ''}
          ${l.price_negotiable ? '<span class="badge ok" style="align-self:flex-start">Торг уместен</span>' : ''}
          ${mort ? `<div class="callout">Ипотека от <b>${money(naurymz ? naurymz.first : mort.first)}</b> в месяц
            <span class="muted xs" style="display:block">${naurymz ? '«Наурыз», 9%, 19 лет, взнос 20%' : 'рыночная, 18%, 20 лет, взнос 20%'} · <a href="calculators.html#mortgage">рассчитать</a></span></div>` : ''}
          ${l.status === 'sold' ? `<div class="notice">Объект уже ${l.deal_type === 'sale' ? 'продан' : 'сдан'}. Подберём похожий вариант.</div>` : ''}
          <button class="btn lg block" type="button" id="book">${l.status === 'sold' ? 'Подобрать похожий' : 'Записаться на просмотр'}</button>
          <div class="grid g2" style="gap:8px">
            ${tel ? `<a class="btn ghost" href="tel:+${phoneDigits(tel)}">${icon('phone')} Позвонить</a>` : ''}
            ${wa ? `<a class="btn ghost" href="${wa}" target="_blank" rel="noopener">${icon('whatsapp')} WhatsApp</a>` : ''}
          </div>
          <button class="btn soft block" type="button" id="ask-q">Задать вопрос по объекту</button>
        </div>
        ${agent ? `<div class="panel-box stack">
          <span class="eyebrow">Ведёт объект</span>
          <div class="agent-card"><div class="avatar">${agent.photo_url ? `<img src="${esc(agent.photo_url)}" alt="">` : esc(agent.full_name.split(' ').map(w => w[0]).join('').slice(0, 2))}</div>
            <div><b>${esc(agent.full_name)}</b> ${agent.is_demo ? '<span class="badge demo">демо</span>' : ''}<div class="small muted">${esc(agent.position || '')}</div>
            ${agent.phone ? `<a class="small mono" href="tel:+${phoneDigits(agent.phone)}">${esc(agent.phone)}</a>` : ''}</div></div>
        </div>` : ''}
        ${marketHtml}
        <p class="form-note">Просмотров: ${num((l.views || 0) + 1)} · Опубликовано: ${l.published_at ? new Date(l.published_at).toLocaleDateString('ru-RU') : '—'}${l.is_demo ? ' · Демо-объект' : ''}</p>
      </aside>
    </div>`;

  // ---- Галерея ----
  let cur = 0;
  const main = document.getElementById('g-main');
  function show(i) {
    cur = (i + slides.length) % slides.length;
    const p = slides[cur];
    main.innerHTML = (p ? `<img src="${esc(p)}" alt="${esc(listingTitle(l))}, фото ${cur + 1}">` : planSvg(l)) +
      (slides.length > 1 ? `<button class="icon-btn gallery-nav prev" type="button" aria-label="Предыдущее">${icon('left')}</button>
        <button class="icon-btn gallery-nav next" type="button" aria-label="Следующее">${icon('right')}</button>
        <span class="gallery-count">${cur + 1} / ${slides.length}</span>` : '') +
      (!p ? '<span class="gallery-count">схема · фото скоро</span>' : '');
    document.querySelectorAll('#g-thumbs button').forEach((b, j) => b.setAttribute('aria-current', j === cur));
  }
  main.addEventListener('click', e => {
    if (e.target.closest('.prev')) show(cur - 1);
    else if (e.target.closest('.next')) show(cur + 1);
  });
  document.getElementById('g-thumbs')?.addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(Number(b.dataset.i)); });
  let tx = null;
  main.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  main.addEventListener('touchend', e => { if (tx === null) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 40) show(cur + (d < 0 ? 1 : -1)); tx = null; });
  show(0);

  // ---- Карта ----
  if (l.lat && l.lng) {
    makeMap(document.getElementById('map'), { lat: l.lat, lng: l.lng, zoom: 15 })
      .then(({ L, map }) => L.marker([l.lat, l.lng], { icon: pricePin(L, moneyShort(l.price)) }).addTo(map))
      .catch(() => {});
  }

  // ---- Действия ----
  document.getElementById('book').addEventListener('click', () => openLead({
    kind: l.status === 'sold' ? (l.deal_type === 'sale' ? 'buy' : 'rent') : 'viewing', listing: l,
    title: l.status === 'sold' ? 'Подобрать похожий объект' : 'Запись на просмотр',
    subtitle: `${l.code} · ${listingTitle(l)}`,
    fields: l.status === 'sold' ? [] : [
      { name: 'date', label: 'Желаемая дата', type: 'date' },
      { name: 'time', label: 'Время', type: 'select', options: ['Любое', 'Утро (9–12)', 'День (12–16)', 'Вечер (16–20)', 'Выходные'] }
    ]
  }));
  document.getElementById('ask-q').addEventListener('click', () => openLead({ kind: 'consult', listing: l, title: 'Вопрос по объекту', subtitle: `${l.code} · ${listingTitle(l)}` }));
  document.getElementById('cmp').addEventListener('click', e => {
    const on = compare.toggle(l.id);
    e.currentTarget.querySelector('span').textContent = on ? 'В сравнении' : 'Сравнить';
    toast(on ? 'Добавлено к сравнению — откройте «Избранное»' : 'Убрано из сравнения');
  });
  document.getElementById('share').addEventListener('click', async () => {
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: listingTitle(l), url });
      else { await navigator.clipboard.writeText(url); toast('Ссылка скопирована'); }
    } catch { toast('Скопируйте ссылку из адресной строки'); }
  });
});
</script>
</body>
</html>
