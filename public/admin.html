<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141F23" media="(prefers-color-scheme: dark)">
<script>try{var t=JSON.parse(localStorage.getItem("qadam-theme"));if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="robots" content="noindex, nofollow">
<title>Админка · Qadam</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  body::before { background: var(--surface); }
  .ed-sec { display: flex; flex-direction: column; gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
  .ed-sec:first-child { border-top: 0; padding-top: 0; }
  .ed-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ed-grid .w2 { grid-column: span 2; } .ed-grid .w3 { grid-column: 1 / -1; }
  @media (max-width: 700px) { .ed-grid { grid-template-columns: minmax(0, 1fr); } .ed-grid .w2 { grid-column: auto; } }
  .modal .input { min-height: 40px; padding: 8px 10px; font-size: var(--fs-sm); }
  .modal textarea.input { min-height: 80px; }
  .thumb { width: 64px; height: 48px; border-radius: 6px; overflow: hidden; background: var(--plan-fill); flex: none; }
  .thumb img, .thumb svg { width: 100%; height: 100%; object-fit: cover; }
  .kv { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-xs); color: var(--ink-2); margin-top: 6px; }
  .kv b { color: var(--ink); font-weight: 600; }
  .setup li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .setup li:last-child { border-bottom: 0; }
  .setup .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
  .att { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .att a { display: block; width: 72px; height: 56px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--plan-fill); font-size: 10px; text-align: center; line-height: 56px; color: var(--ink-2); }
  .att img { width: 100%; height: 100%; object-fit: cover; }
  .sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  table.t td .clip { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.click { cursor: pointer; }
</style>
</head>
<body data-page="admin">
<div id="app"><p class="muted" style="padding:40px">Загрузка…</p></div>
<script type="module" src="admin.js"></script>
</body>
</html>
